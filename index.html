<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Little Prince</title>

<link rel="stylesheet" href="styles.css">
</head>
<body data-active-floor="0">

<div id="hint">[ Press 'E' for Meteor Shower ]</div>

<!-- Background Layers -->
<div id="star-container"></div>
<div class="twinkle-layer twinkle-1"></div>
<div class="twinkle-layer twinkle-2"></div>

<!-- Initial Shooting stars -->
<div class="shooting-star s1"></div>
<div class="shooting-star s2"></div>
<div class="shooting-star s3"></div>

<!-- Custom Message Modal -->
<div id="custom-modal">
  <div class="modal-box">
    <p id="modal-text">Message goes here.</p>
    <button class="loop-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<div id="viewport">
  
  <!-- THE TRAVELING PRINCE (Moves independently across screen) -->
  <div id="traveling-prince">
    <img src="" alt="Traveling Prince" id="prince-img">
  </div>

  <div id="floor-strip">
    <!-- FLOOR 1: HOME PLANET -->
    <section class="floor" data-floor="1">
      <div class="floor-placeholder-box">
        
        <div class="planet-container planet-home" id="home-planet" onclick="showModal('Asteroid B-612. It is barely larger than a house.')">
          <div class="img-placeholder">B-612 Art</div>
          <!-- THE SITTING PRINCE (Attached to the planet) -->
          <div class="sitting-prince" onclick="togglePrincePosture(event)" title="Click to stand up!">
             <img src="" id="sitting-img" alt="Sitting Prince">
          </div>
        </div>
        <div class="planet-container planet-small-2" onclick="showModal('Neighbors planet, hes too lazy that\'s why the baobab has taken over.')">
           <img src="assts/Baobab.jpg" alt="neighbor">
        </div>

        <!-- SECRET EASTER EGG PLANET -->
        <div class="planet-container easter-egg-planet" onclick="triggerMeteorShower(); showModal('Kalbo Kalbo Kalbo!!');">
          <img src="assts/wali.png" alt="jkplanet">
        </div>
        
        <div class="loop-panel" style="top: 200px; right: 200px;">
          <h3>FOR Loop Exhibition</h3>
          <pre><code>for (let i = 0; i < 15; i++) {
  spawnBird();
}</code></pre>
          <button class="loop-btn" onclick="runForLoop()">Run Loop</button>
          <div class="loop-status" id="for-status">Birds spawned: 0</div>
        </div>
      </div>
    </section>

    <!-- FLOOR 2: FIRST GIANT PLANET -->
    <section class="floor" data-floor="2">
      <div class="floor-placeholder-box">
        <div class="planet-container planet-huge-left" onclick="showModal('What a lonely man. He sits on a grand throne with no one to rule but a sleepy old rat. He thinks he commands the sun to set, but he only waits for the sun to do what it always does.')">
          <img src="assts/king.png" alt="king">
        </div>
        <div class="planet-container planet-small-4" onclick="showModal('This is so terribly sad. He drinks to forget that he is ashamed, and he is ashamed because he drinks.')">
           <img src="assts/tippler.png" alt="tippler">
        </div>
        <div class="planet-container planet-small-1" onclick="showModal('Why does he want me to clap for him? He is the only person on this tiny planet, so of course he is the handsomest, richest, and smartest person here.')">
          <img src="assts/conceitedman.png" alt=" conciet">
        </div>
      </div>
    </section>

    <!-- FLOOR 3: SECOND GIANT PLANET -->
    <section class="floor" data-floor="3">
  <div class="floor-placeholder-box">
    <div class="planet-container planet-small-3 businessman-planet"
      onclick="showModal('He counts millions of stars but never looks at their beauty. He thinks owning them makes him rich, but he cannot put a star in his pocket or use it to stay warm.')">
      <div class="img-placeholder">Small 3</div>
    </div>
    <div class="planet-container planet-huge-right geographer-planet"
      onclick="showModal('He sits at a massive desk and writes about mountains and oceans, but he has never walked outside to see them.')">
      <div class="img-placeholder">Huge Planet 2</div>
    </div>
    <div class="planet-container planet-small-5 lamplighter-planet"
      onclick="showModal('His planet turns so fast that he never gets to rest, yet he keeps doing his job. He is the only one who does not seem ridiculous to me.')">
      <div class="img-placeholder">Small 5</div>
    </div>
  </div>
</section>

    <!-- FLOOR 4: THE EARTH -->
    <section class="floor" data-floor="4">
      <div class="floor-placeholder-box">
        <div class="ground-hollow" id="ground-hollow">
          <div class="img-placeholder">Earth Hollow Art</div>
        </div>

        <div class="loop-panel" style="bottom: 300px; left: 150px;">
          <h3>DO-WHILE Loop Exhibition</h3>
          <pre><code>do {
  spawnRose();
  count++;
} while (count < 40);</code></pre>
          <button class="loop-btn" onclick="runDoWhileLoop()">Run Loop</button>
          <div class="loop-status" id="dowhile-status">Roses planted: 0</div>
        </div>

        <div class="choices-container">
          <img id="fox-btn" src="assts/fox.png" class="image-btn" onclick="chooseFox()" alt="Fox: Stay (Add Roses)">
          <img id="snake-btn" src="assts/snake.png" class="image-btn" onclick="chooseSnake()" alt="Snake: Fly Back Home">
</div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
