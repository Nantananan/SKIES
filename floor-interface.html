<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floor Interface Template</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<div id="floor-tag">Floor <span id="floor-tag-num">1</span> / <span id="floor-tag-total">3</span></div>

<button class="nav-btn" id="btn-up" aria-label="Previous floor">&#8593;</button>
<button class="nav-btn" id="btn-down" aria-label="Next floor">&#8595;</button>

<div id="floor-indicator"></div>

<div id="viewport">
  <div id="floor-strip">

    <!-- FLOOR 1 — Night Sky -->
    <section class="floor" data-floor="1">
      <div class="floor-label">Floor 01 — Night Sky</div>
      <div class="floor-placeholder-box frame-style-1" data-slot="floor-1-main" tabindex="0" role="button" aria-label="Floor 1 — interact">

        <div class="stage-layer layer-connector" aria-hidden="true">
          <div class="floor-connector"></div>
          <div class="floor-moon floor-moon-bottom"></div>
        </div>

        <div class="stage-layer layer-stars" aria-hidden="true">
          <div class="star star-a"></div>
          <div class="star star-b"></div>
          <div class="star star-c"></div>
          <div class="star star-d"></div>
          <div class="star star-e"></div>
          <div class="star star-f"></div>
          <div class="star star-g"></div>
          <div class="star star-h"></div>
        </div>

        <div class="stage-layer layer-sky-clickables">
          <button class="sky-clickable comet comet-pos"
                  data-full-src="rtworks/comet.png" data-title="Comet"
                  aria-label="Open Comet">
            <span class="sky-label">Comet</span>
          </button>
          <button class="sky-clickable planet planet-gold planet-sm planet-pos-tr"
                  data-full-src="rtworks/planet-tiny.png" data-title="Tiny Planet"
                  aria-label="Open Tiny Planet">
            <span class="sky-label">Tiny Planet</span>
          </button>
        </div>

      </div>
    </section>

    <!-- FLOOR 2 — Floating Planets -->
    <section class="floor" data-floor="2">
      <div class="floor-label">Floor 02 — Floating Planets</div>
      <div class="floor-placeholder-box frame-style-2" data-slot="floor-2-main" tabindex="0" role="button" aria-label="Floor 2 — interact">

        <div class="stage-layer layer-connector" aria-hidden="true">
          <div class="floor-connector"></div>
          <div class="floor-moon floor-moon-top"></div>
        </div>

        <div class="stage-layer layer-stars" aria-hidden="true">
          <div class="star star-a"></div>
          <div class="star star-c"></div>
          <div class="star star-f"></div>
        </div>

        <div class="stage-layer layer-sky-clickables">
          <button class="sky-clickable planet planet-blue planet-lg planet-pos-mr"
                  data-full-src="rtworks/planet1.png" data-title="Floating Planet"
                  aria-label="Open Floating Planet">
            <span class="sky-label">Floating Planet</span>
          </button>
          <button class="sky-clickable cloud cloud-pos-ml"
                  data-full-src="rtworks/cloud.png" data-title="Cloud"
                  aria-label="Open Cloud">
            <span class="sky-label">Cloud</span>
          </button>
        </div>

      </div>
    </section>

    <!-- FLOOR 3 — Fox & Snake -->
    <section class="floor" data-floor="3">
      <div class="floor-label">Floor 03 — The Grove</div>
      <div class="floor-placeholder-box frame-style-3" data-slot="floor-3-main" tabindex="0" role="button" aria-label="Floor 3 — interact">

        <div class="stage-layer layer-connector" aria-hidden="true">
          <div class="floor-connector"></div>
        </div>

        <div class="stage-layer layer-grove">
          <div class="grove-tree" aria-hidden="true"></div>

          <button class="sky-clickable fox-trigger" id="fox-trigger"
                  data-full-src="rtworks/fox.png" data-title="Fox"
                  aria-label="Fox — stay here">
            <span class="sky-label">Fox — stay here</span>
          </button>

          <button class="sky-clickable snake-trigger" id="snake-trigger"
                  aria-label="Snake — go back">
            <span class="sky-label">Snake — go back</span>
          </button>
        </div>

        <div class="stage-layer layer-legend" aria-hidden="true">
          <div class="location-choices">
            <div class="location-choices-title">Location choices</div>
            <div>Fox = stay at the current floor</div>
            <div>Snake = go back to floor 1</div>
          </div>
        </div>

      </div>
    </section>

    <!-- HIDDEN ROOM — not part of the normal floor count/indicator/nav
         bounds. Only reachable via the Snake trigger. -->
    <section class="floor floor-secret" data-floor="secret" id="floor-secret">
      <div class="floor-label">??? — Hidden Room</div>
      <div class="floor-placeholder-box" data-slot="floor-secret-main" tabindex="0" role="button" aria-label="Hidden room — interact">
        You found the hidden room.
      </div>
    </section>

  </div>
</div>

<!-- Reusable image modal — opened by any .sky-clickable with a data-full-src. -->
<div id="egg-modal" class="egg-modal" hidden>
  <div class="egg-modal-backdrop" id="egg-modal-backdrop"></div>
  <div class="egg-modal-box">
    <button class="egg-modal-close" id="egg-modal-close" aria-label="Close">&times;</button>
    <img id="egg-modal-img" src="" alt="">
    <div id="egg-modal-title" class="egg-modal-title"></div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
